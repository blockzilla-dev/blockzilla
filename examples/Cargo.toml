[package]
name = "blockzilla-dump-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autobins = false
[dependencies]
anyhow = "1.0.104"
# `CompactV2Archive` (local and HTTPS epochs) is behind the reader's `http` feature.
blockzilla-compact-v2-reader = { path = "../crates/compact-v2/blockzilla-compact-v2-reader", features = ["http"] }
blockzilla-model = { path = "../crates/blockzilla-model" }
bs58 = "0.5.1"
clap = { version = "4.6.6", features = ["derive"] }
# Allocation-free base58 and integer text for the row writers.
five8 = "1.0.0"
itoa = "1.0.18"
serde_json = "1.0.151"
[[bin]]
name = "token-dump"
path = "token-dump.rs"
[[bin]]
name = "wallet-dump"
path = "wallet-dump.rs"
[[bin]]
name = "program-dump"
path = "program-dump.rs"
[lints]
workspace = true
