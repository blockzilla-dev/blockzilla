[package]
name = "blockzilla-stream-sidecar"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
[workspace]
[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = "0.8.8"
base64 = "0.22.1"
blockzilla-bank-client = { path = "../../crates/blockzilla-bank-client" }
blockzilla-bank-stream-v2 = { path = "../../crates/blockzilla-bank-stream-v2" }
blockzilla-stream-decoder = { path = "../stream-relay/decoder" }
bs58 = "0.5.1"
bytes = "1.11"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
hmac = "0.13.0"
libc = "0.2.189"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util", "signal"] }
[dev-dependencies]
blockzilla-bank-stream-v2 = { path = "../../crates/blockzilla-bank-stream-v2", features = ["test-fixtures"] }
tempfile = "3.27.0"
[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
