[package]
name = "blockzilla"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Build compact Solana blocks and read Blockzilla archives"
readme = "README.md"
include = ["Cargo.toml", "README.md", "src/**"]
keywords = ["solana", "archive", "streaming", "cli"]
categories = ["command-line-utilities", "database"]
autobins = false
default-run = "blockzilla"

[features]
default = ["known-program-logs"]
known-program-logs = [
    "blockzilla-program-logs/known-program-logs",
    "blockzilla-compact/known-program-logs",
    "blockzilla-archive-v2/known-program-logs",
]

[[bin]]
name = "blockzilla"
path = "src/main.rs"

[dependencies]
blockzilla-model = { version = "0.2.0", path = "../../crates/blockzilla-model" }
blockzilla-compact-v2-reader = { path = "../../crates/compact-v2/blockzilla-compact-v2-reader", features = ["http"], version = "0.2.0" }
blockzilla-archive-v2 = { path = "../../crates/compact-v2/blockzilla-archive-v2", default-features = false, version = "0.2.0" }
blockzilla-compact = { path = "../../crates/compact-v2/blockzilla-compact", default-features = false, version = "0.2.0" }
blockzilla-live-format = { path = "../../crates/blockzilla-live-format", default-features = false, version = "0.2.0" }
blockzilla-primitives = { path = "../../crates/blockzilla-primitives", default-features = false, version = "0.2.0" }
blockzilla-program-logs = { path = "../../crates/parser/blockzilla-program-logs", default-features = false, version = "0.2.0" }
blockzilla-registry = { path = "../../crates/compact-v2/blockzilla-registry", default-features = false, version = "0.2.0" }
anyhow = "1.0.104"
bincode = "1.3.3"
bs58 = "0.5.1"
# Allocation-free base58 and integer text for the token dump rows.
five8 = "1.0.0"
itoa = "1.0.18"
clap = { version = "4.6.6", features = ["derive", "env"] }
gxhash = "3.5.0"
libc = "0.2.189"
memmap2 = "0.9.11"
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
solana-pubkey = "4.2.1"
solana-vote-interface = { version = "=6.0.3", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wincode = { version = "=0.6.1", features = ["derive"] }
zstd = "0.14.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
