[package]
name = "blockzilla-get-block"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "build-slot-index"
path = "src/bin/build_slot_index.rs"
required-features = ["cli"]

[[bin]]
name = "build-slot-resolution"
path = "src/bin/build_slot_resolution.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = [
    "dep:anyhow",
    "dep:clap",
    "dep:zstd",
]
worker = [
    "dep:blockzilla-bank-stream-v2",
    "dep:bytes",
    "dep:futures-channel",
    "dep:futures-util",
    "dep:js-sys",
    "dep:ruzstd",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:worker",
    "dep:solana-signature",
    "dep:thiserror",
]

[dependencies]
blockzilla-bank-stream-v2 = { path = "../../crates/blockzilla-bank-stream-v2", optional = true }
bytes = { version = "1.11", optional = true }
# These features define stored log enum tags. Keep the full archive grammar
# available in an isolated Worker build, as in the native Compact V2 reader.
blockzilla-archive-v2 = { path = "../../crates/compact-v2/blockzilla-archive-v2", default-features = false, features = ["known-program-logs"] }
blockzilla-compact = { path = "../../crates/compact-v2/blockzilla-compact", default-features = false, features = ["known-program-logs"] }
blockzilla-primitives = { path = "../../crates/blockzilla-primitives", default-features = false }
blockzilla-program-logs = { path = "../../crates/parser/blockzilla-program-logs", default-features = false, features = ["known-program-logs"] }
blockzilla-registry = { path = "../../crates/compact-v2/blockzilla-registry", default-features = false }
anyhow = { version = "1.0.104", optional = true }
base64 = "0.23.1"
bs58 = "0.5.1"
clap = { version = "4.6.6", features = ["derive", "env"], optional = true }
five8 = "1.0.0"
futures-channel = { version = "0.3.34", default-features = false, features = ["alloc", "sink"], optional = true }
futures-util = { version = "0.3.34", default-features = false, optional = true }
itoa = "1.0.18"
js-sys = { version = "0.3.105", optional = true }
ruzstd = { version = "0.9.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
wasm-bindgen = { version = "0.2.128", optional = true }
wasm-bindgen-futures = { version = "0.4.78", optional = true }
worker = { version = "0.8.5", features = ["http"], optional = true }
solana-signature = { version = "3.4.1", features = ["verify"], optional = true }
thiserror = { version = "2.0.20", optional = true }
wincode = "=0.6.1"
zstd = { version = "0.14.0", optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
blockzilla-bank-stream-v2 = { path = "../../crates/blockzilla-bank-stream-v2", features = ["test-fixtures"] }
ed25519-dalek = "3.0.0"

[lints]
workspace = true
