[package]
name = "blockzilla-account-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace]

[dependencies]
blockzilla-account-bridge-protocol = { path = "../blockzilla-account-bridge-protocol" }
tokio = { version = "1.53.1", features = ["net", "time", "io-util"] }

[dev-dependencies]
base64 = "0.22.1"
bs58 = "0.5.1"
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
