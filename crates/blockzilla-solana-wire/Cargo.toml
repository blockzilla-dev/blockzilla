[package]
name = "blockzilla-solana-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Solana transaction, execution metadata and source metadata wire codecs"
publish = ["crates-io"]

[features]
default = []
zstd-native = ["dep:zstd"]
zstd-wasm = ["dep:ruzstd"]

[dependencies]
minicbor = { version = "2.3.0", features = ["full"] }
prost = "0.14.4"
quick-protobuf = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
wincode = { version = "=0.6.1", features = ["derive"] }
zstd = { version = "0.14.0", optional = true }
ruzstd = { version = "0.9.0", optional = true }

[build-dependencies]
pb-rs = "0.10.0"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"

[lints]
workspace = true
