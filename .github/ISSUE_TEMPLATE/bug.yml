name: Bug report
description: Report a reproducible problem in Blockzilla.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security issue, use the private reporting process in SECURITY.md.
        Remove credentials and private data from all examples and logs.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the operating system and Rust version when relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest commands or input that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the error and relevant sanitized logs.
    validations:
      required: true
