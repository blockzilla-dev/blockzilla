name: Core checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=native
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-targets
      - run: cargo run --locked -p blockzilla-sample-block-bench -- 1
  stream:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=native
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/stream
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo test --manifest-path zillastream/capture-core/Cargo.toml
      - run: cargo test --manifest-path zillastream/relay/Cargo.toml
      - run: cargo test --manifest-path blockzilla/builder/Cargo.toml
      - run: cargo test --locked --manifest-path crates/blockzilla-bank-client/Cargo.toml
      - run: cargo test --locked --manifest-path blockzilla/get-block/resolver/Cargo.toml

  worker:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RUSTFLAGS: -C target-cpu=generic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - run: cargo check --locked -p blockzilla-get-block --no-default-features --features worker --target wasm32-unknown-unknown --lib
